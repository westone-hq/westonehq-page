:root {
  --page: #F7F8FA; --surface: #FFFFFF; --panel-top: #FFFFFF; --panel-bottom: #EEF0F2;
  --t1: #131417; --t2: rgba(27,28,30,.84); --t3: rgba(27,28,30,.64); --t4: rgba(19,20,23,.32);
  --div1: rgba(19,20,23,.05); --div2: rgba(19,20,23,.10);
  --basic: rgba(19,20,23,.05);
  --green: #02C265; --sun: #F09A1C;
  --land: #F3F4F1; --land2: #E4E9DF; --water: #A9D3F2; --road: #FFFFFF; --road-edge: #DADDE0; --route: #1A73FF;
  --shadow: 0 2px 8px rgba(0,0,0,.12);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { background: #0B0C0E; font-family: "Asta Sans", sans-serif; color: var(--t1); overflow: hidden; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
svg { display: block; }

/* 영상 틀: 1920×1080. 창 크기에 맞춰 줄여서 보여 준다 */
.frame { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; background: var(--page); }
.layer { position: absolute; inset: 0; }

/* ── 장면 1: 숫자로 문제를 꺼낸다 ── */
.sa { background: var(--page); }
.sa-kicker { position: absolute; left: 160px; top: 132px; font-size: 34px; line-height: 44px; color: var(--t3); }
.sa-num { position: absolute; left: 146px; top: 176px; font-size: 440px; line-height: 1; font-weight: 800; letter-spacing: -14px; font-variant-numeric: tabular-nums; }
.sa-num i { font-style: normal; font-size: 220px; letter-spacing: 0; margin-left: 12px; }
.sa-line { position: absolute; left: 160px; top: 690px; font-size: 68px; line-height: 84px; font-weight: 800; letter-spacing: -1px; }
.sa-src { position: absolute; left: 160px; bottom: 64px; font-size: 24px; line-height: 32px; color: var(--t3); }
.sa-path { position: absolute; left: 160px; top: 262px; display: flex; align-items: center; gap: 2px; }
.sa-path span { height: 168px; display: grid; place-items: center; padding: 0 56px; background: var(--div2); font-size: 60px; font-weight: 800; letter-spacing: -1px; }
.sa-path span.last { background: #131417; color: #fff; }
.sa-path svg { width: 72px; height: 72px; margin: 0 12px; color: var(--t4); }
.sa-wall { position: absolute; left: 160px; top: 168px; width: 1600px; display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; }
.sa-wall span { height: 132px; display: grid; place-items: center; background: var(--div2); font-size: 30px; font-weight: 700; color: var(--t2); }
.sa-mark { position: absolute; left: 160px; top: 842px; display: flex; align-items: center; gap: 24px; font-size: 40px; font-weight: 800; }
.logo { display: grid; grid-template-columns: repeat(3, 12px); gap: 4px; }
.logo i { width: 12px; height: 12px; background: #45474D; }
.logo i.s { background: var(--sun); }
.appicon { width: 72px; height: 72px; flex: none; background: #131417; display: grid; place-items: center; }
.appicon .logo { grid-template-columns: repeat(3, 14px); gap: 4px; }
.appicon .logo i { width: 14px; height: 14px; }

/* ── 차 화면(2560×1440)을 줄여서 영상 틀 안에 놓는다 ── */
.disp { position: absolute; left: 0; top: 0; width: 2560px; height: 1440px; transform-origin: 0 0; outline: 18px solid #131417; box-shadow: 0 40px 80px rgba(0,0,0,.28);
  display: grid; grid-template-columns: 854px 1706px; grid-template-rows: 1300px 140px; background: #131417; }

/* 왼쪽 주행 화면 */
.drive { position: relative; background: linear-gradient(var(--panel-top) 0, var(--panel-top) 20%, var(--panel-bottom) 100%); overflow: hidden; }
.dinfo { height: 92px; display: grid; grid-template-columns: 1fr 1fr 1fr; align-items: center; padding: 0 24px; }
.range { justify-self: start; display: flex; align-items: center; gap: 12px; font-size: 34px; font-weight: 500; padding: 6px 14px 6px 8px; margin-left: -8px; }
.range svg { width: 44px; height: 44px; }
.speed { text-align: center; font-size: 30px; font-weight: 300; color: var(--t3); }
.speed b { font-weight: 300; font-size: 34px; }
.prnd { justify-self: end; display: flex; font-size: 34px; font-weight: 400; color: var(--t4); }
.prnd span { width: 38px; height: 48px; display: grid; place-items: center; border-radius: 2px; }
.scene { position: absolute; left: 0; right: 0; top: 92px; bottom: 160px; display: grid; place-items: center; }
.scene svg { width: 560px; }
.media { position: absolute; left: 0; right: 0; bottom: 0; height: 160px; border-top: 1px solid var(--div2); display: flex; align-items: center; padding: 0 24px; gap: 28px; font-size: 30px; }
.media .art { width: 104px; height: 104px; background: var(--div1); display: grid; place-items: center; }
.media .art svg { width: 56px; height: 56px; }
.media .ctl3 { margin-left: auto; display: flex; gap: 56px; color: var(--t2); }
.media .ctl3 svg { width: 48px; height: 48px; }
.mic { position: absolute; left: 0; top: 92px; width: 112px; height: 112px; background: #131417; color: #fff; display: grid; place-items: center; }
.mic svg { width: 56px; height: 56px; }

/* 카드 */
.noti { position: absolute; left: 24px; right: 24px; top: 176px; background: var(--surface); box-shadow: var(--shadow); overflow: hidden; }
.nh { display: grid; grid-template-columns: 1fr 88px; }
.nh .hl { display: grid; grid-template-columns: 72px 1fr; gap: 0 24px; padding: 28px 0 28px 28px; align-items: start; }
.nh .x { display: grid; place-items: start center; padding-top: 34px; color: var(--t3); }
.nh .x svg { width: 40px; height: 40px; }
.nt { font-size: 36px; line-height: 44px; font-weight: 800; letter-spacing: -.3px; }
.nd { font-size: 26px; line-height: 34px; color: var(--t2); margin-top: 6px; }
.nd b { color: var(--t1); font-weight: 700; }
.stackt { position: relative; }
.stackt > * + * { position: absolute; left: 0; top: 0; white-space: nowrap; }
.facts { display: flex; flex-wrap: wrap; gap: 2px; padding: 0 28px 24px 124px; margin-top: -8px; }
.fact { display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 16px 0 12px; background: var(--div1); font-size: 24px; font-weight: 700; white-space: nowrap; }
.fact svg { width: 30px; height: 30px; }
.cells { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; margin-top: 2px; }
.cell { position: relative; height: 128px; background: rgb(243,243,244); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; font-size: 24px; line-height: 30px; color: rgb(110,111,113); }
.cell > svg { width: 44px; height: 44px; }
.cell .ok { position: absolute; right: 8px; top: 6px; width: 30px; height: 30px; color: var(--t1); }
.cell .ok svg { width: 30px; height: 30px; }
.cell .nb { position: absolute; left: 0; right: 0; top: 0; height: 4px; background: var(--t1); }
.cell.manual { background: #fff; color: var(--t2); }
.cell em { font-style: normal; font-size: 22px; color: var(--t3); }
.na { display: grid; gap: 2px; margin-top: 2px; }
.na.two { grid-template-columns: 1fr 1fr; }
.btn { position: relative; overflow: hidden; height: 88px; font-size: 30px; line-height: 38px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.btn.basic { background: var(--basic); }
.btn.filled { background: #131417; color: #fff; }
.btn .cd { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: rgba(255,255,255,.18); }
.btn .pk { position: absolute; inset: 0; background: rgba(255,255,255,.18); }
.btn .bl { position: relative; }
.chipc { display: grid; grid-template-columns: 56px 1fr 180px; align-items: center; gap: 20px; height: 88px; padding-left: 16px; }
.chipc .appicon { width: 56px; height: 56px; }

  const [sh, f] = mapAt(t), pts = PTS[sh][f];
  for (let i = 0; i < 9; i++) put('pin' + i, pts.pins[i], sh === 'm12');
  put('mkBusan', pts.busan, sh === 'm11'); put('mkKinder', pts.kinder, ['m21', 'm23', 'm24'].includes(sh)); put('mkHome', pts.home, sh === 'm24');
  put('mkCar', sh === 'm41' ? pts.home : sh === 'm21' ? null : (sh === 'm11' || sh === 'm12') ? pts.start : sh === 'm24' ? pts.kinder : pts.car, !(sh === 'm11' && f > 18 && f < 100));
  const src = `maps/${sh}/${P2(f)}.jpg`;
  if (src === lastSrc) return Promise.resolve();
  lastSrc = src; const im = $('mapimg'); im.src = src; return im.decode().catch(() => {});
}
window.videoDuration = 73.5;
window.seekAsync = async s => { tl.pause().time(Math.max(0, Math.min(73.499, s)), false); await apply(s); };
// 미리 보기: 창에 맞추고 스페이스로 재생
// ── 보기: 창에 맞추고, 음악과 함께 재생 ──
const DUR = 73.5, au = new Audio('music.m4a'); au.preload = 'auto';
document.body.insertAdjacentHTML('beforeend', `<div id="ui"><button id="pp" aria-label="재생">▶</button><input id="sb" type="range" min="0" max="${DUR}" step="0.01" value="0" aria-label="재생 위치"><span id="tc">0:00 / 1:13</span></div>`);
const css = document.createElement('style');
css.textContent = `html,body{margin:0;height:100%;background:#000;overflow:hidden}
#ui{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;gap:14px;padding:14px 20px;background:linear-gradient(transparent,rgba(0,0,0,.7));color:#fff;font:14px system-ui,sans-serif;transition:opacity .3s;z-index:9}
body.hide #ui{opacity:0} #pp{width:40px;height:40px;border:0;background:#fff;color:#000;font-size:16px;cursor:pointer} #sb{flex:1;accent-color:#fff} #tc{font-variant-numeric:tabular-nums;min-width:96px;text-align:right}`;
document.head.appendChild(css);
function fit() { const k = Math.min(innerWidth / 1920, innerHeight / 1080); $('frame').style.transform = `translate(${(innerWidth - 1920 * k) / 2}px,${(innerHeight - 1080 * k) / 2}px) scale(${k})`; }
addEventListener('resize', fit); fit();
const mmss = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
let playing = false, t0 = 0, base = 0, busy = false;
function show(t) { $('sb').value = t; $('tc').textContent = `${mmss(t)} / ${mmss(DUR)}`; }
async function loop() { if (!playing) return; const s = au.paused || !au.duration ? base + (performance.now() - t0) / 1000 : au.currentTime;
  if (s >= TO && TO < DUR) { stop(); seekAsync(FROM).then(() => { show(FROM); if (!playing) play(); }); return; }
  if (s >= DUR) { stop(); seekAsync(DUR - 0.01); show(DUR); return; } if (!busy) { busy = true; await seekAsync(s); busy = false; } show(s); requestAnimationFrame(loop); }
function play() { if (tl.time() >= DUR - 0.05 || tl.time() >= TO) seekAsync(FROM); playing = true; base = tl.time(); t0 = performance.now(); au.currentTime = base; au.play().catch(() => {}); $('pp').textContent = '❚❚'; document.body.classList.add('hide'); requestAnimationFrame(loop); }
function stop() { playing = false; au.pause(); $('pp').textContent = '▶'; document.body.classList.remove('hide'); }
const toggle = () => playing ? stop() : play();
$('pp').onclick = toggle; $('frame').onclick = toggle;
$('sb').oninput = e => { const t = +e.target.value; if (playing) stop(); seekAsync(t); show(t); };
addEventListener('mousemove', () => { document.body.classList.remove('hide'); clearTimeout(window._h); if (playing) window._h = setTimeout(() => document.body.classList.add('hide'), 1500); });
addEventListener('keydown', e => { if (e.key === ' ') { e.preventDefault(); toggle(); } if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { const t = Math.max(0, Math.min(DUR, tl.time() + (e.key === 'ArrowRight' ? 5 : -5))); if (playing) stop(); seekAsync(t); show(t); } });
const q = new URLSearchParams(location.search);
// 홈페이지에 넣을 때(?embed=1): 소리 없이 저절로 재생하고 끝나면 처음부터 다시
const EMBED = !!q.get('embed');
// 구간 재생(?embed=1&from=초&to=초): from에서 시작해 to에 닿으면 from으로 돌아가 반복
const FROM = EMBED ? Math.max(0, Math.min(DUR, +(q.get('from') || 0))) : 0;
const TO = EMBED && q.get('to') ? Math.max(FROM + 0.5, Math.min(DUR, +q.get('to'))) : DUR;
if (EMBED) {
  const st = document.createElement('style');
  st.textContent = '#ui{display:none!important}#frame{cursor:default}';
  document.head.appendChild(st);
  $('frame').onclick = null;
}
// 바깥 페이지(같은 origin)에서 보내는 조작: {type:'pause'} {type:'play'} {type:'seek', t:초}
// held: 바깥에서 멈춘 상태. 이때는 아래 1.2초 자동 재생 타이머가 다시 틀지 않는다
// ?paused=1 이면 멈춘 채로 시작한다(동작 줄이기)
let held = EMBED && !!q.get('paused');
if (EMBED) addEventListener('message', e => {
  if (e.origin !== location.origin || e.source !== parent || !e.data || typeof e.data !== 'object') return;
  const m = e.data;
  if (m.type === 'pause') { held = true; stop(); }
  else if (m.type === 'play') { held = false; if (!playing) play(); }
  else if (m.type === 'seek' && isFinite(m.t)) {
    const t = Math.max(FROM, Math.min(TO - 0.05, +m.t));
    stop(); seekAsync(t).then(() => { show(t); if (!held) play(); });
  }
});
seekAsync(q.get('t') ? +q.get('t') : FROM).then(() => {
  show(tl.time()); window.ready = true;
  if (EMBED) { au.muted = true; if (!held) play(); setInterval(() => { if (!playing && !held) play(); }, 1200); }
});
</script>
